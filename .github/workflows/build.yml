name: Build

# Every push to main (and every pull request) gets the checks. Tags (v*) and
# manual runs also package the app for Windows, macOS and Linux.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository; artifacts are uploaded with the
# run's own token, not repository write access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes an older check run; release builds always finish.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Third-party actions are pinned to exact commits (tags can be moved).
# Dependabot (.github/dependabot.yml) proposes updates to these pins.
jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # No dependency install scripts run (none are needed to build or test).
      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  package:
    name: Package (${{ matrix.platform }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            builder-args: --win nsis portable
            files: dist/*.exe
          - platform: macos
            os: macos-latest
            builder-args: --mac --x64 --arm64
            files: |
              dist/*.dmg
              dist/*.zip
          - platform: linux
            os: ubuntu-latest
            builder-args: --linux AppImage deb
            files: |
              dist/*.AppImage
              dist/*.deb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache for release builds: a cache written by another run
      # can't end up inside a shipped package.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install deps
        run: npm ci --ignore-scripts

      # The tests touch file paths, so they run on each platform too.
      - name: Test
        run: npm test

      - name: Build app
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.builder-args }} --publish never

      # Compare these with Get-FileHash / shasum on a downloaded file to check
      # it is exactly what this run built.
      - name: Checksums
        shell: bash
        working-directory: dist
        run: |
          shopt -s nullglob
          shasum -a 256 *.exe *.dmg *.zip *.AppImage *.deb | tee SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: red-ledger-${{ matrix.platform }}
          path: |
            ${{ matrix.files }}
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
